[project]
name = "agentops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.0",
  "httpx>=0.27",
  "openai>=1.40",
  "streamlit>=1.38",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["agentops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs the Docker Compose stack running"]
addopts = "-m 'not docker'"
